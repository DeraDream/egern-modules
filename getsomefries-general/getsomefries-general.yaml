name: "🍟 Fries：通用增强（Egern）"
description: "将 GetSomeFries 通用模块移植为 Egern 规则：代理检测与真实 IP 相关域名直连，并排除部分不应 MITM 的域名。"
author: "VirgilClyne / DeraDream"
homepage: "https://github.com/DeraDream/egern-modules/tree/main/getsomefries-general"

# 来源：GetSomeFries General.sgmodule
# Egern 没有 Surge 的 skip-proxy / always-real-ip 字段，以下使用 DIRECT 规则实现等效网络路径。
rules:
  # Skip proxy：代理检测、系统服务和局域网地址
  - domain_wildcard:
      match: "*.local"
      policy: DIRECT
  - domain:
      match: localhost
      policy: DIRECT
  - domain:
      match: captive.apple.com
      policy: DIRECT
  - domain:
      match: e.crashlytics.com
      policy: DIRECT
  - domain:
      match: www.baidu.com
      policy: DIRECT
  - domain:
      match: passenger.t3go.cn
      policy: DIRECT
  - domain:
      match: yunbusiness.ccb.com
      policy: DIRECT
  - domain:
      match: wxh.wo.cn
      policy: DIRECT
  - domain:
      match: gate.lagou.com
      policy: DIRECT
  - domain:
      match: www.abchina.com.cn
      policy: DIRECT
  - domain:
      match: login-service.mobile-bank.psbc.com
      policy: DIRECT
  - domain:
      match: mobile-bank.psbc.com
      policy: DIRECT
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 127.0.0.1/32
      policy: DIRECT
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT
  - ip_cidr:
      match: 192.168.122.1/32
      policy: DIRECT
  - ip_cidr:
      match: 193.168.0.1/32
      policy: DIRECT
  - ip_cidr6:
      match: "::1/128"
      policy: DIRECT
  - ip_cidr6:
      match: "fe80::/10"
      policy: DIRECT

  # Always real IP：Egern 通过直连避免代理/占位解析干扰
  - domain_wildcard:
      match: "*.lan"
      policy: DIRECT
  - domain_wildcard:
      match: "*.direct"
      policy: DIRECT
