# 原模块的 hostname 排除项。只有主配置启用了 MITM 时才生效。
mitm:
  hostnames:
    excludes:
      - "*.facebook.com"
      - "*.instagram.com"
      - "*.twitter.com"
      - "*.snssdk.com"
      - "*.pstatp.com"
      - gateway.icloud.com
      - gateway.icloud.com.cn
      - weather-data.apple.com
      - buy.itunes.apple.com
      - ios.chat.openai.com
