name: "高德地图去广告"
description: "Egern 原生高德地图去广告模块：清理开屏、首页、搜索、路线规划、导航结束、附近和打车页面推广"
author: "DeraDream（基于 RuCu6、kokoryh、ishowshu、可莉的规则适配）"
homepage: "https://github.com/DeraDream/egern-modules"
open_url: "https://apps.apple.com/app/id461703208"
icon: "https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Amap.png"

rules:
  - domain:
      match: "amap-aos-info-nogw.amap.com"
      policy: REJECT
  - domain:
      match: "free-aos-cdn-image.amap.com"
      policy: REJECT
  - domain_suffix:
      match: "v.smtcdns.com"
      policy: REJECT

scriptings:
  - http_request:
      name: "高德广告接口拦截"
      match: "^https?://(?:amap-aos-info-nogw|ai|m5|m5-zb|oss|sns)\\.amap\\.com/"
      script_url: "https://raw.githubusercontent.com/DeraDream/egern-modules/main/amap-adblock.js?v=1"
      timeout: 10
      update_interval: 86400

  - http_response:
      name: "高德广告内容清理"
      match: "^https://(?:info|m5|m5-zb)\\.amap\\.com/(?:v1/ai_rec/|ws/)"
      script_url: "https://raw.githubusercontent.com/DeraDream/egern-modules/main/amap-adblock.js?v=1"
      body_required: true
      max_size: 5242880
      timeout: 10
      update_interval: 86400

mitm:
  hostnames:
    includes:
      - "*.amap.com"
