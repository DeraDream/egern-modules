name: po0 防火墙自动加白
description: 调用 po0 防火墙 API 将本机当前出口 IP 加入白名单。仅在网络变化时自动加白，网络切换后等待 2 秒。加白 API 走直连。可选：token 后加 @槽位（如 pgnfw_xxx@0）钉固定坑位、永不被淘汰。
author: reallinzc
homepage: https://github.com/DeraDream/egern-modules/tree/main/po0fw

# 安装后在模块参数 tokens 填入 pgnfw_ token（多台机器用英文逗号分割）。
# 可选：token 后加 @槽位（如 pgnfw_xxx@0）把本机 IP 钉在该坑位、永不被 LRU 淘汰。
compat_arguments:
  tokens: ""

# 加白 API 必须直连，确保服务端看到的是本机真实出口 IP 而不是代理出口
rules:
  - ip_cidr:
      match: 124.221.69.228/32
      policy: DIRECT
      no_resolve: true

scriptings:
  - network:
      name: po0-fw-network
      script_url: https://raw.githubusercontent.com/DeraDream/egern-modules/main/po0fw/po0-firewall-whitelist.js
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
        initial_delay_ms: "2000"
