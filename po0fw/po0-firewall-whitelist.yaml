name: po0 防火墙自动加白
description: 调用 po0 防火墙 API 将本机当前出口 IP 加入白名单。支持多 token（英文逗号分割，一台机器一个），每 10 分钟 cron 与网络变化时自动加白。加白 API 走直连。
author: reallinzc
homepage: https://github.com/DeraDream/egern-modules/tree/main/po0fw

# 安装后在模块参数 tokens 填入添加网段链接中的 token（多台机器用英文逗号分割）。
compat_arguments:
  tokens: ""

# 加白 API 必须直连，确保服务端看到的是本机真实出口 IP 而不是代理出口
rules:
  - domain:
      match: console.po0.io
      policy: DIRECT

scriptings:
  - schedule:
      name: po0-fw-cron
      cron: "*/10 * * * *"
      script_url: https://raw.githubusercontent.com/DeraDream/egern-modules/main/po0fw/po0-firewall-whitelist.js?v=4
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
        initial_delay_ms: "0"
  - network:
      name: po0-fw-network
      script_url: https://raw.githubusercontent.com/DeraDream/egern-modules/main/po0fw/po0-firewall-whitelist.js?v=4
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
        initial_delay_ms: "2000"
